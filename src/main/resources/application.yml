spring:
  application:
    name: springdatajdbc
  datasource:
    url: jdbc:h2:mem:test
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: embedded

server:
  port: 8080

logging:
  level:
    org.springframework.jdbc.core: DEBUG
    com.mvc: DEBUG
    org.springframework: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/mvc.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
